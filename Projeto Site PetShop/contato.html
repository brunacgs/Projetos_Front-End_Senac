<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caramelo Petshop</title>
    <link rel= stylesheet href="style.css">
</head>
<body>
    <header>
        <img src="images\caramelo.png" alt="" class="caramelo">
        <img src="images\logo.png" alt="" class="logo">
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Quem Somos</a>
        <a href="produtos.html">Produtos</a>
        <a href="serviços.html">Serviços</a>
        <a href="contato.html">Contatos</a>    
    </nav> 
    <main>
        <section class="endereço">
            <h2>Venha conhecer nosso espaço</h2>
            <br>
            <p>
                <img src="images\location.png" alt="ícone de localização" height="20px">
                Rua dos Bobos, nº 0
            </p>
            <p>
                <img src="images\horario.png" alt="ícone de relógio" height="20px">
                Seg a sex: 8h às 18h
                <br>Sáb: 8h às 14h
            </p>
            <br>
            <img src="images\fachada.png" alt="Imagem da fachada do Caramelo PetShop" class="fachada">
        </section>
        <br>
        <br>
        <section class="contatos">
            <div class="contatos1">
                <h2>Entre em contato através do formulário ou nossos canais de atendimento:</h2>
                <br>
                <form>
                    <fieldset>
                        <div class="formulario">
                            <label>Nome completo:</label>
                            <input type="text" required placeholder="Digite seu nome">
                        </div>
                        <div class="formulario">
                            <label>E-mail:</label>
                            <input type="email" required placeholder="Insira seu e-mail">
                        </div>
                        <div class="formulario">
                            <label>whatsapp:</label>
                            <input required placeholder="Insira seu número de whatsapp">
                        </div>
                        <div class="formulario">
                            <label>Mensagem:</label>
                            <textarea rows="3" required placeholder="Escreva aqui sua mensagem"></textarea>
                        </div>
                        <div class="formulario">
                            <button type="submit" class="botaoenviar">Enviar</button>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div>
                <div class="iconecontato"><img src="images\whatsapp.png" alt="ícone do Whatsapp" height="30px"></div>
                <div class="iconecontato"><img src="images\email.png" alt="ícone do e-mail" height="30px"></div>
                <div class="iconecontato"><img src="images\instagram.png" alt="ícone do Instagram" height="30px"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>
            @caramelopetshop
            <br>Rua dos Bobos, nº0
            <br>(11)99999-9999
            <br>caramelo@caramelopetshop.com
        </p>
    </footer>
</body>
</html>
