<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Store</title>
    <link rel= stylesheet href="style.css">
</head>
<body>
    <header>
        <a href="index.html"><img class="imglogo" src="images\icone_logo.png"></a>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="atendimento.html">Atendimento</a></li>
            </ul>    
        </nav>  
    </header>
    <hr>
    <main>
        <fieldset>
            <legend><img src="images\icone.png">FALE CONOSCO</legend>
            <form>
                <label>Nome:</label>
                <input type="text" placeholder="Digite seu nome completo" id="nome">
                <label>E-mail:</label>
                <input type="email" placeholder="Insira seu email" id="email">
                <label>Idade:</label>
                <input type="number" placeholder="Insira sua idade" id="idade">
                <label>Assunto:</label>
                <select>
                    <option value="Dúvida sobre produto">Dúvida sobre produto</option>
                    <option value="Problema com compra">Problema com compra</option>
                    <option value="Outros">Outros</option>
                </select>
                <label>Mensagem:</label>
                <textarea type="text" rows="5" placeholder="Escreva aqui sua mensagem."></textarea>
                <button type="button" id="enviarmsg" onclick="enviar()" class="botao1">Enviar</button>
                <p id="msg1"></p>
                <p id="msg2"></p>
            </form>
        </fieldset>
    </main>
    <hr>
    <footer>
        <img src="images\logo_completa.png">
        <p>
            @pixelstore
            <br>Rua dos Bobos, n° 0
            <br>Vale do Silício - Marte
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
